name: Full calibration validation

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

jobs:
  quality:
    if: github.event.label.name == 'enhancement'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out calibrated branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Run quick quality gate
        run: uv run epok-tdd gate --mode quick
      - name: Export validated source
        uses: actions/upload-artifact@v4
        with:
          name: calibrated-epok-tdd-source
          path: |
            docs
            src
            tests
            AGENTS.md
            CHANGELOG.md
            CONTRIBUTING.md
            LICENSE
            README.md
            pyproject.toml

  mutation:
    if: github.event.label.name == 'enhancement'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out calibrated branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Run full mutation gate
        run: uv run epok-tdd gate --mode full
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-evidence
          path: |
            mutants
            .mutmut-cache
          if-no-files-found: warn

  audit:
    if: github.event.label.name == 'enhancement'
    name: audit-${{ matrix.label }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: epok-auth
            repository: epok200/epok_auth
            python: "3.12"
            package: "epok-auth[postgres]"
            import_name: epok_auth
            pytest_command: >-
              uv run pytest -m "not integration" --cov=epok_auth --cov-branch
              --cov-report=json:coverage.json
          - label: cortex-agent-sdk
            repository: epok200/cortex_agent_sdk
            python: "3.13"
            package: "cortex-agent-sdk[all]"
            import_name: cortex_agent_sdk
            pytest_command: >-
              uv run --with pytest-cov pytest -m "not smoke"
              --cov=cortex_agent_sdk --cov-branch
              --cov-report=json:coverage.json
    steps:
      - name: Check out calibrated branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check out target library
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: main
          path: target
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Smoke-install published target
        id: install
        shell: bash
        run: |
          set +e
          set -o pipefail
          uv run --no-project --with '${{ matrix.package }}' python -c \
            "import importlib, importlib.metadata as metadata; importlib.import_module('${{ matrix.import_name }}'); print(metadata.version('${{ matrix.label }}'))" \
            2>&1 | tee target/install-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Install target development environment
        working-directory: target
        run: uv sync --all-groups --all-extras
      - name: Run target tests with branch coverage
        id: tests
        working-directory: target
        shell: bash
        run: |
          set +e
          set -o pipefail
          ${{ matrix.pytest_command }} 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run target Ruff
        id: lint
        working-directory: target
        shell: bash
        run: |
          set +e
          set -o pipefail
          uv run ruff check . 2>&1 | tee lint-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run target Pyright
        id: types
        working-directory: target
        shell: bash
        run: |
          set +e
          set -o pipefail
          uv run pyright 2>&1 | tee types-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run calibrated Epok TDD audit
        id: audit
        shell: bash
        run: |
          set +e
          uv run epok-tdd --config target/pyproject.toml check target/src \
            --coverage target/coverage.json --format json --no-baseline \
            > target/epok-report.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build summary
        env:
          TARGET_LABEL: ${{ matrix.label }}
          INSTALL_EXIT: ${{ steps.install.outputs.exit_code }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          LINT_EXIT: ${{ steps.lint.outputs.exit_code }}
          TYPES_EXIT: ${{ steps.types.outputs.exit_code }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          target = Path('target')
          report = json.loads((target / 'epok-report.json').read_text())
          summary = {
              'library': os.environ['TARGET_LABEL'],
              'install_exit_code': int(os.environ['INSTALL_EXIT']),
              'tests_exit_code': int(os.environ['TEST_EXIT']),
              'lint_exit_code': int(os.environ['LINT_EXIT']),
              'types_exit_code': int(os.environ['TYPES_EXIT']),
              'audit_exit_code': int(os.environ['AUDIT_EXIT']),
              'coverage_present': (target / 'coverage.json').exists(),
              'finding_count': len(report.get('effective_findings', [])),
              'metric_count': len(report.get('metrics', [])),
          }
          (target / 'audit-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: calibrated-audit-${{ matrix.label }}
          path: |
            target/audit-summary.json
            target/epok-report.json
            target/coverage.json
            target/install-output.txt
            target/test-output.txt
            target/lint-output.txt
            target/types-output.txt
          if-no-files-found: warn
